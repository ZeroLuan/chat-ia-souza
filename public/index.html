<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat de IA com Llama 3.3 70B pela API da Groq — TEC13 IFBA Irecê" />
  <title>Chat de IA · Groq + Llama</title>
  <link rel="stylesheet" href="css/index.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="topo">
      <div>
        <h1>⚡ Chat de IA</h1>
        <p>Monitor de Algoritmos · IFBA Irecê</p>
      </div>
      <div class="controles">
        <select id="modelo" aria-label="Modelo">
          <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
          <option value="openai/gpt-oss-20b">GPT-OSS 20B (rápido)</option>
        </select>
        <button id="limpar" class="secundario" type="button">Nova conversa</button>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite"></section>

    <footer id="painel" class="painel">Tokens: — · Custo da sessão: US$ 0,000000</footer>

    <form id="form" class="entrada">
      <input id="mensagem" type="text" placeholder="Pergunte algo sobre programação..." autocomplete="off" />
      <button id="enviar" type="submit">Enviar</button>
    </form>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
